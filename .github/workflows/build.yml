name: Build Tyrant

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies
        shell: cmd
        run: |
          call vendor\fetch.bat
          if errorlevel 1 exit /b 1
          call vendor\fetch-jdk-headers.bat
          if errorlevel 1 exit /b 1

      - name: Configure (CMake + VS)
        shell: pwsh
        run: |
          $vsroot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsroot) { throw "Visual Studio C++ tools not found on runner" }
          $cmake = Join-Path $vsroot "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          $vsroot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $cmake = Join-Path $vsroot "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\tyrant_agent.dll dist\
          Copy-Item build\Release\tyrant_injector.exe dist\
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tyrant-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 30
